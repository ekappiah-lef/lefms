# Serves the built SPA and reverse-proxies the API + uploaded files to the
# backend container, so the browser only ever sees one origin (no CORS,
# no separate public port/DNS name for the API).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Matches multer's 15MB attachment limit in server/routes/attachments.js
    # with headroom; nginx's own default (1MB) would reject larger uploads
    # before they ever reach the API.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
