services:

  # ============================================================
  # DATABASE
  # ============================================================
  db:
    image: mysql:8.0
    container_name: lefms-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-lefms}
      MYSQL_USER: ${DB_USER:-lefms}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

    volumes:
      # Persistent database storage
      - db_data:/var/lib/mysql

      # Runs only when the database volume is genuinely new/empty
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - lefms

    # No ports published.
    # MySQL is accessible only inside the Docker network.


  # ============================================================
  # BACKEND API
  # ============================================================
  backend:
    build:
      context: ./server

    image: ${REGISTRY:-lefms}/backend:${IMAGE_TAG:-latest}
    container_name: lefms-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      NODE_ENV: production

      PORT: 4000

      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-lefms}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-lefms}

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}

    volumes:
      # Persistent uploaded files
      - uploads_data:/app/uploads

    networks:
      - lefms

    # Backend is NOT exposed to the host.
    # Frontend Nginx communicates with:
    #
    # http://backend:4000
    #
    # through the Docker network.


  # ============================================================
  # FRONTEND + INTERNAL NGINX
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

      args:
        VITE_API_URL: ${VITE_API_URL:-/api}

    image: ${REGISTRY:-lefms}/frontend:${IMAGE_TAG:-latest}
    container_name: lefms-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      # Only expose the application to the HOST machine.
      #
      # It is NOT directly exposed to the Internet.
      # Host Nginx will reverse proxy to this port.
      - "127.0.0.1:8001:80"

    networks:
      - lefms


# ==============================================================
# DOCKER NETWORK
# ==============================================================
networks:
  lefms:
    driver: bridge


# ==============================================================
# PERSISTENT STORAGE
# ==============================================================
volumes:
  db_data:
  uploads_data: